name: publish-vllm-plugin

# Publishes vllm-fusion-embedding (the vLLM serving plugin in vllm_fusion_embedding/)
# to PyPI via Trusted Publishing (OIDC, no token). Manual trigger only: the plugin
# versions independently of the root package's release cadence.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        working-directory: vllm_fusion_embedding
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: vllm_fusion_embedding/dist
